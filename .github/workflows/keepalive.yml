name: Supabase keepalive

on:
  schedule:
    # 每 8 小時一次（台灣時間 0:17、8:17、16:17）。
    # Supabase 免費專案要「每天幾次」資料庫請求才算有活動，每 3 天一次會被寄暫停警告。
    # 避開整點，GitHub 整點排程比較容易延遲或被跳過。
    - cron: "17 */8 * * *"
  workflow_dispatch:         # 可以在 Actions 頁面手動執行

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sSf "https://jpemsdwilisnaktcwpio.supabase.co/rest/v1/days?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
